<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon or AWS Quiz</title>
  <meta name="description" content="AWSサービス名の正式名称が Amazon か AWS か当てるクイズゲーム。Can you tell if it's Amazon or AWS?" />
  <meta property="og:title" content="Amazon or AWS Quiz" />
  <meta property="og:description" content="AWSサービス名の正式名称を当てよう！" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles/style.css" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R6DP22DL1W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-R6DP22DL1W');
  </script>
</head>
<body>
  <!-- Header -->
  <header class="header" role="banner">
    <span class="header-logo" aria-label="Amazon or AWS Quiz">Amazon or AWS ?<span class="header-version" aria-label="version 1.7">v1.7</span></span>
    <div class="header-controls">
      <button id="lang-toggle" type="button" aria-label="Switch language">EN</button>
    </div>
  </header>

  <!-- Start Screen -->
  <main>
    <section id="start-screen" class="screen" aria-label="Start screen">
      <div class="card">
        <span class="start-badge">Quiz Game</span>
        <h1 class="start-title">Amazon or AWS ?</h1>
        <p class="start-subtitle">AWSサービスの正式名称を当てよう！</p>
        <p class="service-count-text"></p>
        <div class="start-meta">
          <span class="meta-item">
            <span class="meta-icon">📝</span>
            <span>20問</span>
          </span>
          <span class="meta-item">
            <span class="meta-icon">⌨️</span>
            <span>キーボード対応</span>
          </span>
          <span class="meta-item">
            <span class="meta-icon">🌐</span>
            <span>日本語 / English</span>
          </span>
        </div>
        <button id="start-btn" type="button">クイズ開始</button>
      </div>
    </section>

    <!-- Quiz Screen -->
    <section id="quiz-screen" class="screen" aria-label="Quiz screen" aria-live="polite">
      <div class="card">
        <!-- Quiz header -->
        <div class="quiz-header">
          <div class="quiz-meta-row">
            <span class="progress-text">問題 1 / 20</span>
            <span class="score-text">スコア: 0/0</span>
          </div>
          <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" style="width:0%"></div>
          </div>
        </div>

        <!-- Streak -->
        <div class="streak" hidden aria-live="polite"></div>

        <!-- Question -->
        <div class="question-area">
          <div class="service-icon-wrap">
            <img class="service-icon" src="" alt="Service icon" width="64" height="64" />
          </div>
          <div class="service-name" aria-label="Service name">Lambda</div>
          <div class="question-text">このサービスの正式名称は？</div>

          <div class="answer-btns" role="group" aria-label="Answer choices">
            <button class="answer-btn" type="button" data-answer="Amazon" aria-label="Amazon" aria-pressed="false">Amazon</button>
            <button class="answer-btn" type="button" data-answer="AWS" aria-label="AWS" aria-pressed="false">AWS</button>
          </div>
        </div>

        <!-- Answer result (hidden until answered) -->
        <div class="answer-result" hidden aria-live="assertive">
          <div class="verdict-next-row">
            <div class="result-verdict"></div>
            <button class="next-btn" type="button" hidden>次へ</button>
          </div>
          <div class="full-name"></div>
          <div class="service-description"></div>
          <a class="service-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
            <svg class="service-link-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span class="service-link-text">AWS公式ページ</span>
          </a>
        </div>

        <!-- Keyboard hint (desktop only) -->
        <div class="keyboard-hint" aria-hidden="true">
          <kbd>1</kbd> Amazon &nbsp;|&nbsp; <kbd>2</kbd> AWS &nbsp;|&nbsp; <kbd>Enter</kbd> 次へ
        </div>
      </div>
    </section>

    <!-- Result Screen -->
    <section id="result-screen" class="screen" aria-label="Result screen">
      <div class="card">
        <h2 class="result-title">クイズ終了！</h2>

        <div class="result-score-section">
          <div class="score-label">Score</div>
          <div class="final-score" aria-label="Score">— / —</div>
        </div>

        <div class="result-details">
          <div class="detail-box">
            <div class="detail-label accuracy-label">正答率</div>
            <div class="accuracy-value">—%</div>
          </div>
          <div class="detail-box">
            <div class="detail-label rank-label">ランク</div>
            <div class="rank-value">—</div>
          </div>
        </div>

        <div class="result-actions">
          <button id="play-again-btn" type="button">もう一度</button>
          <a id="share-btn" href="#" role="button">
            <i class="x-icon" aria-hidden="true">𝕏</i>
            <span>Xでシェア</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./src/main.ts"></script>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo">
    <div class="site-footer-links">
      <a class="site-footer-link" href="https://github.com/ishiharatma/aws-or-amazon-quiz" target="_blank" rel="noopener noreferrer">

        aws-or-amazon-quiz
      </a>
      <a class="site-footer-link" href="https://ishiharatma.github.io/" target="_blank" rel="noopener noreferrer">
        <img src="https://ishiharatma.github.io/favicon.ico" class="site-footer-icon" alt="" width="14" height="14" />
        Portfolio
      </a>
    </div>
    <div class="site-footer-copy">&copy; <span id="footer-year"></span> issy. All rights reserved.</div>
  </footer>

</body>
</html>
